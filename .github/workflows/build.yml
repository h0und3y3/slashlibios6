name: Build Slashlib iOS 6 DEB

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']

permissions:
  contents: write   # needed only for Release upload on tags

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      THEOS: ${{ github.workspace }}/.theos
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bash ca-certificates curl dpkg-dev fakeroot \
            git libxml2 make perl rsync unzip xz-utils

      - name: Install Theos
        run: |
          mkdir -p "$(dirname "$THEOS")"
          curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos \
            -o "$RUNNER_TEMP/install-theos"
          bash "$RUNNER_TEMP/install-theos"
          test -f "$THEOS/makefiles/common.mk"
          test -x "$THEOS/toolchain/linux/iphone/bin/clang"
          echo "$THEOS/bin" >> "$GITHUB_PATH"

      - name: Install iPhoneOS 9.3 SDK
        run: |
          mkdir -p "$THEOS/sdks"
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/theos/sdks.git "$RUNNER_TEMP/theos-sdks"
          git -C "$RUNNER_TEMP/theos-sdks" sparse-checkout set iPhoneOS9.3.sdk
          cp -a "$RUNNER_TEMP/theos-sdks/iPhoneOS9.3.sdk" "$THEOS/sdks/"
          test -f "$THEOS/sdks/iPhoneOS9.3.sdk/SDKSettings.plist"

      - name: Build DEB
        run: |
          mkdir -p build
          bash build-theos.sh 2>&1 | tee build/build.log

      - name: Upload DEB artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Slashlib-iOS6-DEB
          path: |
            build/ru.slashlib.client_0.3.0_iphoneos-arm.deb
            build/build.log
          if-no-files-found: warn
          retention-days: 30

      - name: Attach DEB to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && success()
        uses: softprops/action-gh-release@v2
        with:
          files: build/ru.slashlib.client_0.3.0_iphoneos-arm.deb
