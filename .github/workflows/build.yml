name: Build Slashlib iOS 6 (IPA + DEB)
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']

jobs:
  build-ios6:
    # GitHub-hosted macOS images no longer ship an ARMv7-capable legacy Xcode.
    # Register a self-hosted Mac runner with labels: self-hosted, macOS, ios6.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify legacy Apple toolchain
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -showsdks | grep -q iphoneos
          xcodebuild -project Slashlib.xcodeproj -scheme Slashlib -showBuildSettings | grep -q 'IPHONEOS_DEPLOYMENT_TARGET = 6.0'
          xcrun --sdk iphoneos --show-sdk-path
          command -v dpkg-deb >/dev/null || (command -v brew >/dev/null && brew install dpkg)
          command -v dpkg-deb
      - name: Build ARMv7 app for iOS 6+
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project Slashlib.xcodeproj -scheme Slashlib -configuration Release -sdk iphoneos \
            ARCHS=armv7 VALID_ARCHS=armv7 IPHONEOS_DEPLOYMENT_TARGET=6.0 \
            CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR="$PWD/build" clean build
      - name: Package IPA and Debian package
        run: |
          ./package-ipa.sh
          ./package-deb.sh
      - name: Upload both packages
        uses: actions/upload-artifact@v4
        with:
          name: Slashlib-iOS6-packages
          path: |
            build/Slashlib.ipa
            build/ru.slashlib.client_0.3.0_iphoneos-arm.deb
          if-no-files-found: error
      - name: Attach packages to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/Slashlib.ipa
            build/ru.slashlib.client_0.3.0_iphoneos-arm.deb
