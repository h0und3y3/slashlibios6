name: Build Slashlib iOS 6 (Theos / Linux)

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-theos-linux:
    runs-on: ubuntu-22.04
    env:
      THEOS: ${{ github.workspace }}/.theos
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate project configuration
        run: |
          chmod +x ./scripts/*.sh
         ./scripts/check-build-config.sh
      - name: Install Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bash build-essential ca-certificates curl fakeroot git libio-compress-lzma-perl \
            libtinfo6 make perl python3 rsync unzip zip xz-utils

      - name: Install Theos and Linux iOS toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$THEOS"
          CI=1 THEOS="$THEOS" bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          test -x "$THEOS/toolchain/linux/iphone/bin/clang"
          echo "$THEOS/bin" >> "$GITHUB_PATH"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

      - name: Install iPhoneOS 9.3 SDK for ARMv7
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$THEOS/sdks"
          # iPhoneOS9.3 is in the SDK repository tree (it is not one of the
          # binary assets attached to the current SDK Release).
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/theos/sdks.git /tmp/theos-sdks
          git -C /tmp/theos-sdks sparse-checkout set iPhoneOS9.3.sdk
          cp -a /tmp/theos-sdks/iPhoneOS9.3.sdk "$THEOS/sdks/"
          test -d "$THEOS/sdks/iPhoneOS9.3.sdk"

      - name: Build IPA and DEB with Theos
        shell: bash
        run: |
          set -euo pipefail
          ./build-theos.sh

      - name: Upload IPA and DEB
        uses: actions/upload-artifact@v4
        with:
          name: Slashlib-iOS6-Theos-Linux
          path: |
            build/Slashlib.ipa
            build/*.deb
          if-no-files-found: error
          retention-days: 30

      - name: Attach packages to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/Slashlib.ipa
            build/*.deb
